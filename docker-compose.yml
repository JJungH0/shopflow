
services:
  mysql-user:
    image: mysql:8.0
    container_name: shopflow-mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: shopflow_user
    ports:
      - "3307:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql

  redis:
    image: redis:7.0
    container_name: shopflow-redis
    ports:
      - "6380:6379"

volumes:
  mysql-user-data:
